<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>荔枝 · 账号首页与荔圈首样</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fcf5e7;color:#303d32;font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif}button{font:inherit;color:inherit;cursor:pointer}.shell{width:min(1024px,100%);min-height:100dvh;margin:auto;background:#fffaf0;display:grid;grid-template-columns:160px minmax(0,1fr);box-shadow:0 0 40px #74532c13}.rail{padding:34px 15px;background:#f6edda;border-right:1px solid #dacdb4}.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:#772d32;font-size:23px;margin:0 0 36px}.brand img{width:44px;border-radius:14px}.rail section{display:grid;gap:7px}.navitem{border:0;border-radius:16px;background:transparent;text-align:left;padding:10px 13px;white-space:nowrap}.navitem img{width:24px;height:24px;object-fit:contain;vertical-align:middle;margin-right:9px}.active{background:#ffe2ce;color:#8c372d;font-weight:700}.page{padding:24px clamp(16px,4vw,48px) 42px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eadfc6;padding-bottom:12px;color:#6f6b52}.top small{font-size:13px}.hero{min-height:180px;display:flex;align-items:flex-end;margin:20px 0 22px;padding:22px;border-radius:24px;background:linear-gradient(90deg,#ffeed5f7 5%,#ffeed580 60%,transparent),url('../../source/source/web/mobile/orchard-courtyard.jpg') 50% 62%/cover}.hero h1{margin:0;color:#4c402d;font-size:clamp(25px,4vw,36px)}h2{font-size:20px;margin:24px 0 10px}.pill,.back{background:#fffaf2;border:1px solid #d9c5a0;border-radius:22px;padding:5px 12px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:13px}.row{display:flex;gap:15px;align-items:center;width:100%;border:1px solid #e7dac0;border-radius:17px;background:#fffdf5;text-align:left;padding:12px}.row img{width:56px;height:56px;border-radius:13px;object-fit:cover}.row span{flex:1}.row small,.muted{color:#736f5d;font-size:13px;display:block}.goal{padding:13px 15px;background:#f3f0dc;border-radius:14px;border-left:4px solid #8f9f67}.headline{display:flex;align-items:center;justify-content:space-between;gap:10px}.bubble{width:fit-content;max-width:85%;padding:10px 15px;border:1px solid #e5d8c3;background:#fffdf5;border-radius:4px 15px 15px;margin:5px 0 15px}.when{text-align:center;color:#89816a;font-size:13px;margin:18px 0}.chat{border-top:1px solid #e1d5bc;min-height:180px;margin-top:10px}.groups{display:grid;gap:10px}footer{color:#80785e;margin-top:30px;font-size:12px}@media(max-width:650px){.shell{display:block}.rail{position:fixed;z-index:2;bottom:0;left:0;right:0;border:0;border-top:1px solid #dfd1b6;padding:5px 8px max(5px,env(safe-area-inset-bottom));background:#fff6e8}.rail .brand{display:none}.rail section{display:flex;justify-content:space-around;gap:0}.navitem{padding:4px 12px;text-align:center;font-size:12px}.navitem img{display:block;margin:0 auto 2px}.cards{grid-template-columns:1fr}.page{padding-bottom:92px}.hero{min-height:145px}}
</style>
<div class="shell"><aside class="rail"><div class="brand"><img src="../../source/source/web/mobile/icon.png" alt="">荔枝</div><section id="tabs"></section></aside><main class="page"><div class="top"><b>荔枝</b><small>本地首样 · 示例账号</small></div><div id="view"></div></main></div>
<script>
const base='../../source/source/web/mobile/', tabs=[['荔圈','chat'],['工具箱','tools'],['荔枝园','garden'],['我','me']];
const groups=[['周末约饭','4 位成员','break-room.webp','周六老地方见？'],['散步搭子','3 位成员','garden-feed.webp','今晚沿河走一圈吧。']];
const view=document.querySelector('#view');
function choose(tab){document.querySelector('#tabs').innerHTML=tabs.map(([name,icon],i)=>'<button class="navitem '+(i===tab?'active':'')+'" onclick="choose('+i+')"><img alt="" src="'+base+'nav-'+icon+'-on.webp">'+name+'</button>').join('');
  if(tab===0){view.innerHTML='<div class="hero"><h1>小荔的首页</h1></div><h2>我的约定</h2><div class="goal"><strong>周六去看展</strong><small class="muted">周六 14:00</small></div><h2>我的群聊</h2><div class="cards">'+groups.map(([name,n,img],i)=>'<button class="row" onclick="room('+i+')"><img alt="" src="'+base+img+'"><span><b>'+name+'</b><small>'+n+'</small></span>›</button>').join('')+'</div><h2>好友消息</h2><button class="row" onclick="dm()"><span><b>阿青</b><small>明天见！</small></span>›</button>';}
  else view.innerHTML='<h1>'+tabs[tab][0]+'</h1><p>本次首样可体验账号首页、群聊和返回。</p><button class="pill" onclick="choose(0)">回荔圈</button>';}
function conversation(name,info,body){view.innerHTML='<p><button class="back" onclick="choose(0)">‹ 返回荔圈</button></p><div class="headline"><h1>'+name+'</h1><span class="muted">'+info+'</span></div><div class="chat"><div class="when">今天 10:30</div><small>阿青</small><p class="bubble">'+body+'</p></div>';}
function room(i){conversation(groups[i][0],groups[i][1],groups[i][3]);}
function dm(){conversation('阿青','好友私聊','明天见！');}
choose(0);
</script>
</html>
