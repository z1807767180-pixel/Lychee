<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>荔枝 · 两种首页布局</title>
<style>
@font-face{font-family:Yuan;src:url("../../source/client/fonts/LXGW975YuanSC-500W.woff2")}@font-face{font-family:Yuan;src:url("../../source/client/fonts/LXGW975YuanSC-700W.woff2");font-weight:bold}*{box-sizing:border-box}
:root{--ink:#263c31;--muted:#675f53;--line:#e7dfce;--paper:#fffaf1;--red:#9e3e38;--green:#295941}body{margin:0;color:var(--ink);background:#eee8dc;font:16px/1.45 Yuan,system-ui,sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ae5749;outline-offset:2px}.switch{display:flex;align-items:center;justify-content:center;gap:4px;padding:7px 5px;background:#324d3e;color:#fff4dd;font:13px/1.4 system-ui,sans-serif}.switch>button,.switch>a{padding:6px 10px;border-radius:16px;color:inherit;text-decoration:none}.switch>button[aria-pressed=true]{background:#fff0cf;color:#324d3e;font-weight:700}.switch .refs{font-size:12px;border-left:1px solid #7e9181;border-radius:0;margin-left:3px}
.app{width:min(100%,980px);height:calc(100dvh - 44px);margin:0 auto;background:var(--paper);display:flex;flex-direction:column;box-shadow:0 0 65px #55412719}.scroll{flex:1;min-height:0;overflow:auto}.inner{max-width:740px;margin:auto;padding:16px clamp(16px,4vw,32px) 20px}.mast{display:flex;align-items:center;gap:10px;margin-bottom:17px}.mast img{width:34px;height:34px;border-radius:11px}.mast h1{font-size:24px;margin:0;color:#703d2c;letter-spacing:.04em}.mast .spacer,.ctitle .spacer{flex:1}.outline,.quiet,.chip,.back{border:1px solid #d9cdb5;border-radius:20px;padding:5px 12px;background:#fffcf6}.quiet{border-color:transparent;background:#f1ead9}.chip{padding:6px 14px;color:#5d6156;white-space:nowrap}.chip[aria-pressed=true]{background:#315f46;border-color:#315f46;color:white}.small{font-size:13px;color:var(--muted)}h2{font-size:21px;margin:0}h3{font-size:17px;margin:0}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:19px 0 8px}.filters{display:flex;gap:6px;margin:12px 0 6px;flex-wrap:wrap}.row{width:100%;padding:11px 0;display:flex;align-items:center;gap:12px;text-align:left;border-bottom:1px solid var(--line)}.art{width:49px;height:49px;border-radius:15px;object-fit:cover;flex:none;background:#f3e4c8}.round{border-radius:50%}.copy{min-width:0;flex:1}.copy strong,.copy small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.copy strong{font-size:17px}.copy small{font-size:14px;color:var(--muted);margin-top:3px}.last{align-self:stretch;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-around;min-width:39px}.clock{font:12px/1 system-ui,sans-serif;color:#716958}.badge{font:bold 12px/20px system-ui,sans-serif;text-align:center;background:#a7443b;color:#fff;border-radius:10px;padding:0 6px;min-width:20px;display:inline-block}.type{font-size:12px;color:#6b725a;background:#eceddc;border-radius:5px;padding:1px 4px;margin-left:6px;font-weight:500;vertical-align:1px}.indication{display:flex;align-items:center;gap:10px;padding:9px 0;color:#705745;border-bottom:1px solid var(--line);width:100%;text-align:left}.indication b{font-size:14px;color:var(--red)}.indication span{flex:1}.chevron{color:#8a846e;font-size:20px}.datecard{display:flex;align-items:center;gap:12px;min-height:98px;padding:13px 16px;border:1px solid #d9dcc6;border-radius:20px;background:linear-gradient(90deg,#f6f1da 18%,#faf2dcde 55%,#fff5d20d),url('../../source/source/web/mobile/orchard-courtyard.jpg') center 55%/cover;text-align:left;width:100%;color:#393f2b}.day{display:grid;place-items:center;line-height:1.02;padding:7px 10px;border-right:1px solid #a8af8c}.day small{font-size:12px}.day strong{font:600 31px Georgia,serif}.datecard h2{font-size:20px}.groupgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.groupbox{min-width:0;text-align:left;border:1px solid var(--line);border-radius:16px;padding:9px;background:#fffdf6;display:flex;align-items:center;gap:8px}.groupbox .art{width:39px;height:42px;border-radius:10px}.groupbox b{font-size:15px}.groupbox small{display:block;color:var(--muted);font-size:12px}.nav{display:flex;border-top:1px solid #dfd4bd;background:#fff6e7;justify-content:space-around;padding:5px 7px max(5px,env(safe-area-inset-bottom));gap:5px}.nav button{flex:1;max-width:130px;border-radius:12px;padding:3px 8px;font-size:13px;color:#665b4e}.nav button.on{color:#863c31;background:#f4e4cc;font-weight:bold}.navimg{position:relative;display:block;margin:auto;width:29px;height:25px}.navimg img{width:26px;height:24px;object-fit:contain}.navimg .badge{position:absolute;top:-2px;left:19px;line-height:15px;font-size:10px;min-width:15px;padding:0 4px}.ctitle{display:flex;align-items:center;gap:12px;margin:3px 0 18px}.ctitle h1{font-size:22px;margin:0}.when{display:block;text-align:center;font-size:13px;color:var(--muted);margin:16px 0}.chatline{display:flex;align-items:flex-start;gap:8px;margin:13px 0}.chatline .art{width:33px;height:33px;border-radius:11px}.bubble{max-width:min(87%,460px);padding:9px 13px;border:1px solid var(--line);border-radius:4px 14px 14px;background:white;overflow-wrap:anywhere}.mine{justify-content:flex-end}.mine .bubble{background:#e5edcf;border-color:#c8d5b2}.composer{display:flex;gap:8px;margin-top:23px}.composer input{width:0;flex:1;border:1px solid #d8cfbb;border-radius:16px;padding:9px}.send{background:var(--green);color:white;padding:6px 14px;border-radius:16px}.notice{padding:15px;background:#f5f0df;border-radius:14px}.gardenrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:13px;width:100%;text-align:left;margin:11px 0;background:#fffcf4}.gardenrow span{flex:1}.guide{max-width:610px;margin:auto}.guide a{color:var(--green)}.guide li{margin-bottom:15px}
@media(min-width:750px){.app{flex-direction:row-reverse}.nav{flex-direction:column;justify-content:flex-start;min-width:115px;padding-top:22px;border-top:0;border-right:1px solid var(--line)}.nav button{flex:none;min-height:55px}.inner{padding-top:26px}.row{padding:13px 0}}
@media(max-width:360px){.inner{padding-left:12px;padding-right:12px}.switch>button{padding:6px 7px}.groupbox{gap:5px;padding:7px}.chip{padding:5px 10px}}
</style>
<div class="switch"><button id="designA" onclick="design('A')">A 聊天优先</button><button id="designB" onclick="design('B')">B 个人首页</button><button class="refs" onclick="go('refs')">参考图与说明</button></div>
<div class="app"><main class="scroll"><div class="inner" id="view"></div></main><nav class="nav" id="nav" aria-label="主导航"></nav></div>
<script>
const root='../../source/source/web/mobile/', tabs=[['home','荔圈','chat'],['garden','荔枝园','garden'],['tools','工具箱','tools'],['me','我','me']];
const chats=[
 {id:'food',name:'周末约饭',kind:'群聊',art:'break-room.webp',time:'10:42',count:2,from:'阿青',msg:'周六的小馆订好啦，六点见！',members:'4 位成员'},
 {id:'qing',name:'阿青',kind:'私聊',art:'orchard-mascot.webp',time:'10:38',count:1,from:'阿青',msg:'那本书我带过来。',members:'我的好友'},
 {id:'walk',name:'散步搭子',kind:'群聊',art:'tile-garden.webp',time:'09:20',count:0,from:'小栗',msg:'今天走河边那条小路吗？',members:'3 位成员'},
 {id:'li',name:'小栗',kind:'私聊',art:'yard65-basket.webp',time:'昨天',count:0,from:'小栗',msg:'收到了，多谢你的荔枝。',members:'我的好友'},
 {id:'photo',name:'手机摄影小组',kind:'群聊',art:'garden-feed.webp',time:'周三',count:0,from:'阿禾',msg:'把昨天的落日留在这里。',members:'5 位成员'},
 {id:'book',name:'周日读书会',kind:'群聊',art:'tile-goal.webp',time:'',count:0,from:'',msg:'',members:'2 位成员'}];
const prototypes={};let d,screen,detail,filter;
const state=()=>prototypes[d];
function design(value){d=value;if(!prototypes[d])prototypes[d]={counts:chats.map(x=>x.count),garden:[1,1],sent:{}};filter='全部';go('home')}
function go(next,id){screen=next;detail=id;render();document.querySelector('.scroll').scrollTop=0}
const img=(file,cls='art')=>'<img class="'+cls+'" src="'+root+file+'" alt="">';
const badge=n=>n?'<b class="badge">'+n+'</b>':'';
const chatTotal=()=>state().counts.reduce((a,b)=>a+b,0);
function renderNav(){let area=({room:'home',contacts:'home',goal:'home',news:'garden'})[screen]||screen;
 nav.innerHTML=tabs.map(([key,name,icon])=>'<button class="'+(area===key?'on':'')+'" onclick="go(\''+key+'\')"><span class="navimg">'+img('nav-'+icon+'-on.webp','')+badge(key==='home'?chatTotal():key==='garden'?state().garden[0]+state().garden[1]:0)+'</span>'+name+'</button>').join('')}
function mast(title,access=false){return '<header class="mast">'+img('icon.png','')+'<h1>'+title+'</h1><span class="spacer"></span>'+(access?'<button class="outline" onclick="go(\'contacts\')">好友</button>':'')+'</header>'}
function headback(title,back='home'){return '<header class="ctitle"><button class="back" onclick="go(\''+back+'\')" aria-label="返回">‹ 返回</button><h1>'+title+'</h1></header>'}
function row(c){let i=chats.indexOf(c);return '<button class="row" data-chat="'+c.id+'" onclick="openRoom('+i+')">'+img(c.art,c.kind==='私聊'?'art round':'art')+'<span class="copy"><strong>'+c.name+'<em class="type">'+c.kind+'</em></strong><small>'+(c.msg?(c.kind==='群聊'?c.from+'：':'')+c.msg:'还没有消息')+'</small></span><span class="last"><time class="clock">'+c.time+'</time>'+badge(state().counts[i])+'</span></button>'}
function home(){
 if(d==='A')return mast('荔圈',true)+'<button class="indication" onclick="go(\'goal\')"><b>我的约定</b><span>周六 14:00　去看展</span><i class="chevron">›</i></button><div class="sectionhead"><h2>消息</h2><small class="small">'+chatTotal()+' 条未读</small></div><div class="filters">'+['全部','未读','群聊','私聊'].map(x=>'<button class="chip" aria-pressed="'+(x===filter)+'" onclick="changeFilter(\''+x+'\')">'+x+'</button>').join('')+'</div>'+chats.filter((c,i)=>filter==='全部'||filter===c.kind||filter==='未读'&&state().counts[i]).map(row).join('');
 return mast('小荔的首页',true)+'<button class="datecard" onclick="go(\'goal\')"><span class="day"><small>十一月</small><strong>28</strong></span><span><small>我的约定 · 周六 14:00</small><h2>一起去看展</h2></span></button><div class="sectionhead"><h2>最近消息</h2><small class="small">'+chatTotal()+' 条未读</small></div>'+chats.map(row).join('')}
function changeFilter(val){filter=val;render()}
function openRoom(i){state().counts[i]=0;go('room',i)}
function garden(){return mast('荔枝园')+'<div class="sectionhead"><h2>好友动态</h2></div>'+['园中事','问一问'].map((n,i)=>'<button class="gardenrow" onclick="openNews('+i+')">'+img(i?'garden-question.webp':'garden-feed.webp')+'<span><b>'+n+'</b><small class="small">'+(i?'阿青直接回复了你的提问':'小栗发了一条园中事')+'</small></span>'+badge(state().garden[i])+'›</button>').join('')}
function openNews(i){state().garden[i]=0;go('news',i)}
function render(){designA.setAttribute('aria-pressed',d==='A');designB.setAttribute('aria-pressed',d==='B');let html='';
 if(screen==='home')html=home();
 if(screen==='room'){const c=chats[detail];html=headback(c.name)+'<small class="small">'+c.members+'</small><time class="when">昨天 18:20</time><div class="chatline mine"><div class="bubble">好，明天再聊。</div></div><time class="when">今天 '+(c.time.includes(':')?c.time:'10:00')+'</time><div class="chatline">'+img(c.art)+'<div class="bubble">'+c.msg+'</div></div><div id="sent"></div><form class="composer"><input maxlength="300" aria-label="示例消息" placeholder="写点什么…"><button class="send">发送</button></form>'}
 if(screen==='contacts'||screen==='groups'){let group=screen==='groups';html=headback(group?'我的群聊':'我的好友')+chats.filter(c=>c.kind===(group?'群聊':'私聊')).map(row).join('')}
 if(screen==='goal')html=headback('我的约定')+'<div class="datecard"><span class="day"><small>十一月</small><strong>28</strong></span><span><h2>一起去看展</h2><small>周六 14:00　市美术馆</small></span></div>';
 if(screen==='garden')html=garden();
 if(screen==='news')html=headback(detail?'问一问':'园中事','garden')+'<article class="notice"><small>'+(detail?'阿青 · 直接回复你':'小栗 · 好友动态')+'</small><h3>'+(detail?'周末看展要提前预约吗？':'河边的桂花开了')+'</h3><p>'+(detail?'阿青：预约了，周六下午两点见。':'散步回来，风里还有花香。')+'</p></article>';
 if(screen==='tools'||screen==='me')html=mast(screen==='tools'?'工具箱':'我')+'<p>此首样可体验荔圈、我的约定和荔枝园的未读提醒。</p><button class="outline" onclick="go(\'home\')">回荔圈</button>';
 if(screen==='refs')html='<section class="guide">'+headback('参考图与说明')+'<p>两个方案使用同一组本地示例消息，读取状态分别保存到本次预览结束。</p><ul><li>A 将群聊和私聊按消息时间混排，可筛未读。<a href="https://blog.whatsapp.com/find-messages-faster-with-chat-filters" target="_blank" rel="noopener">WhatsApp 官方筛选示意图 ↗</a></li><li>好友从消息页一键进入，两稿共用。<a href="https://guide.line.me/ja/update/chat-renewal2025.html" target="_blank" rel="noopener">LINE 官方聊天与好友切换图 ↗</a></li><li>B 保留个人约定小卡，下面只列最近消息，群聊和私聊各出现一次。<a href="https://guide.line.me/ja/update/home-renewal2026.html" target="_blank" rel="noopener">LINE 官方首页分区示意图 ↗</a></li></ul></section>';
 view.innerHTML=html;renderNav();
 if(screen==='room'){const id=chats[detail].id,show=text=>{const row=document.createElement('div'),bubble=document.createElement('div');row.className='chatline mine';bubble.className='bubble';bubble.textContent=text;row.append(bubble);document.querySelector('#sent').append(row)};(state().sent[id]||[]).forEach(show);view.querySelector('form').onsubmit=e=>{e.preventDefault();const input=view.querySelector('input');const text=input.value.trim();if(text){(state().sent[id]||=[]).push(text);show(text);input.value=''}}}}
design(location.hash==='#A'?'A':'B');
</script>
</html>
