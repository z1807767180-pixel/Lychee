name: Build Lychee Android release
on:
  push:
    branches: ['android/6.4.7-release']
    paths: ['source/android/**', '.github/workflows/android-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Build from archived 6.4.7 mobile resources
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          digest=856b197061106f08cb3eb3126998de1a508b9d412956c86b099a0c13571ad975
          python3 history/binary-archive/restore.py --select "$digest" --out "$RUNNER_TEMP/original"
          assets=$(find "$RUNNER_TEMP/original" -name '*.zip' -type f)
          python3 source/android/build.py --assets "$assets" --expected-build 6.4.7 --sha256 "$digest" --unsigned-release --out "$RUNNER_TEMP/unsigned.apk"
          mkdir dist
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 "$RUNNER_TEMP/unsigned.apk" dist/Lychee-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging dist/Lychee-unsigned.apk | head -c 4000 || true
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" source/android/package-lock.json dist/
          cd dist && sha256sum Lychee-unsigned.apk apksigner.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Lychee-offline-signing-input
          path: dist/
          retention-days: 7
