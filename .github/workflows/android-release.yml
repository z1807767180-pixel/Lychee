name: Build Lychee Android release
on:
  push:
    branches: ['android/7.0.0-release']
    paths: ['source/android/**', '.github/workflows/android-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Build from the checked-out shared client
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/central-mirror.gradle" <<'GRADLE'
          beforeProject { p ->
              p.buildscript.repositories.maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
              p.repositories.maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
          }
          GRADLE
          version=$(python3 -c 'import json;print(json.load(open("source/public-build.json"))["version"])')
          assets="$RUNNER_TEMP/lychee-mobile-assets.zip"
          python3 source/android/mobile_assets.py --checkout --expected-build "$version" --out "$assets"
          digest=$(sha256sum "$assets" | cut -d' ' -f1)
          python3 source/android/build.py --assets "$assets" --expected-build "$version" --sha256 "$digest" --unsigned-release --out "$RUNNER_TEMP/unsigned.apk"
          mkdir dist
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 "$RUNNER_TEMP/unsigned.apk" dist/Lychee-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging dist/Lychee-unsigned.apk | head -c 4000 || true
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" source/android/package-lock.json dist/
          cd dist && sha256sum Lychee-unsigned.apk apksigner.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Lychee-offline-signing-input
          path: dist/
          retention-days: 7
