name: Test and distribute Lychee Android 6.4.7
on:
  push:
    branches: ['android/6.4.7-release']
    paths: ['distribution/android-6.4.7/**', '.github/workflows/android-delivery.yml']
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore and verify the owner-signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(cat distribution/android-6.4.7/build-run.txt)
          gh run download "$run" --name Lychee-offline-signing-input --dir "$RUNNER_TEMP/input"
          mkdir dist
          python3 distribution/android-6.4.7/restore.py "$RUNNER_TEMP/input/Lychee-unsigned.apk" distribution/android-6.4.7/signature.json dist/Lychee-6.4.7.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs dist/Lychee-6.4.7.apk | tee "$RUNNER_TEMP/cert"
          grep -Fi '054fd27dbf65d9c734589ba3be6ab280eed888417b179fd725da99667d73b948' "$RUNNER_TEMP/cert"
          "$tools/zipalign" -c -P 16 4 dist/Lychee-6.4.7.apk
          "$tools/aapt2" dump badging dist/Lychee-6.4.7.apk > "$RUNNER_TEMP/badging"
          grep -F "name='dev.lychee.pilot' versionCode='60407' versionName='6.4.7'" "$RUNNER_TEMP/badging"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/badging"; then exit 1; fi
          cd dist && sha256sum Lychee-6.4.7.apk > SHA256SUMS.txt
      - name: Install and open the app on Android
        timeout-minutes: 18
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          image='system-images;android-35;google_apis;x86_64'
          sdkmanager "$image" emulator platform-tools
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd -n lychee -k "$image" --force
          emulator -avd lychee -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          trap 'adb emu kill >/dev/null 2>&1 || true' EXIT
          timeout 240 adb wait-for-device
          for i in $(seq 1 80); do [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && break; sleep 3; done
          adb shell input keyevent 82
          adb install dist/Lychee-6.4.7.apk
          adb shell am start -W -n dev.lychee.pilot/.MainActivity
          for i in $(seq 1 35); do
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb exec-out cat /sdcard/window.xml > "$RUNNER_TEMP/window.xml" || true
            if grep -Eq '注册新账号|登录荔枝园' "$RUNNER_TEMP/window.xml"; then
              echo "Login UI verified on Android 15."
              exit 0
            fi
            sleep 3
          done
          adb shell dumpsys activity activities | grep -m1 mResumedActivity || true
          cat "$RUNNER_TEMP/window.xml" | head -c 7000
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Lychee-Android-verified
          path: dist/
          retention-days: 7
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish verified APK in the existing Lychee repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --name Lychee-Android-verified --dir dist
          (cd dist && sha256sum --check SHA256SUMS.txt)
          gh release create android-v6.4.7 dist/Lychee-6.4.7.apk dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title '荔枝 Android 6.4.7' --notes '安卓朋友请下载 Lychee-6.4.7.apk，然后按手机提示安装。支持 Android 7.0 及以上的兼容设备，需要联网及可用的 Android System WebView。'
